
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e .
          pip install pytest ruff mypy
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Go migration contract drift
        run: PYTHONPATH=src python scripts/export-go-migration-contracts.py --check
      - name: Pytest
        run: pytest -q

  go-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK for Go SQLite runtime
        run: sdkmanager "ndk;29.0.14206865"
      - name: Go tests and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build sealed Android Go runtime
        run: go run ./cmd/repoctl build-runtime --output-root /tmp/chrootctl-runtime --jobs 2
      - name: Build Go-native module
        run: go run ./cmd/repoctl build-module --runtime-dir /tmp/chrootctl-runtime/arm64-v8a --output-dir /tmp/chrootctl-module --zip /tmp/chrootctl-magisk.zip --checksum
      - name: Build source artifact with repoctl
        run: go run ./cmd/repoctl build-source --version ci --output /tmp/chrootctl-source-ci.tar.gz --checksum

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Gradle compile
        working-directory: android
        run: ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Gradle lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e .
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run seeded E2E suite
        env:
          CHROOTCTL_E2E_FIXTURES: '1'
          CHROOTCTL_E2E_DASHBOARD_MODE: dense
        run: npx playwright test
