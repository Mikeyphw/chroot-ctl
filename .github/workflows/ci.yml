
name: ci

on:
  push:
  pull_request:

jobs:
  go-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;29.0.14206865'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify native NDK for CGO/SQLite runtime
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
      - name: Native Devtool and R1 source contracts (not device qualification)
        run: |
          go run ./cmd/devtoolgates actions
          go run ./cmd/devtoolgates r1
      - name: Go-only repository and contract validation
        run: go run ./cmd/repoctl validate
      - name: Build sealed Android Go runtime
        run: go run ./cmd/repoctl build-runtime --output-root /tmp/chrootctl-runtime --jobs 2
      - name: Build Go-native module
        run: go run ./cmd/repoctl build-module --runtime-dir /tmp/chrootctl-runtime/arm64-v8a --output-dir /tmp/chrootctl-module --zip /tmp/chrootctl.zip --checksum
      - name: Build source artifact with repoctl
        run: go run ./cmd/repoctl build-source --version ci --output /tmp/chrootctl-source-ci.tar.gz --checksum
