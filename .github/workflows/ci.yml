name: chrootctl source-contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Static hosted pipeline and Skybind R1 contracts
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/devtoolgates actions
          go run ./cmd/devtoolgates r1
      - name: API-03 root feature consumer source tests
        shell: bash
        run: bash scripts/api03-source-check.sh
      # Native Android builds, WebUI test suite and full qualification run only
      # through the canonical Devtool hosted-release DAG, not this lane.
