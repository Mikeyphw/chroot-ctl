
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e .
          pip install pytest ruff mypy
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Gradle compile
        working-directory: android
        run: ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Gradle lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e .
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run seeded E2E suite
        env:
          CHROOTCTL_E2E_FIXTURES: '1'
          CHROOTCTL_E2E_DASHBOARD_MODE: dense
        run: npx playwright test
