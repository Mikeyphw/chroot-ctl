[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrootctl"
version = "0.11.0"
description = "Manage Termux chroot installs and runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7.0", "PyYAML>=6.0"]

[project.scripts]
chrootctl = "chrootctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
chrootctl = ["resources/tools/*.yaml", "resources/addons/*.yaml", "resources/tool-scripts/*.sh", "resources/addon-scripts/*.sh"]
