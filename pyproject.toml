[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrootctl"
version = "0.11.0"
description = "Manage Termux chroot installs and runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7.0"]

[project.scripts]
chrootctl = "chrootctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
