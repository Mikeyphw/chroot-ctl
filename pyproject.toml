[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrootctl"
version = "0.11.0"
description = "Manage Termux chroot installs and runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7.0", "PyYAML>=6.0", "pydantic>=2.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
chrootctl = "chrootctl.cli:main"
chrootctl-app = "chrootctl.bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
chrootctl = ["resources/tools/*.yaml", "resources/addons/*.yaml", "resources/tool-scripts/*.sh", "resources/tool-scripts/*.py", "resources/addon-scripts/*.sh", "resources/addon-scripts/*.py"]


[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
