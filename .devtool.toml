[wrapper]
schema = 2
default_command = "build"

[wrapper.commands.build]
description = "build through canonical Devtool and EXO"
devtool = "build"
target = "chrootctl_go"
allow_passthrough = true

[wrapper.commands.test]
description = "test through canonical Devtool and EXO"
devtool = "test"
target = "chrootctl_go"
allow_passthrough = true

[wrapper.commands.module-build]
description = "module-build through canonical Devtool and EXO"
workflow = "build"
target = "chrootctl_root_module"

[wrapper.commands.module-test]
description = "module-test through canonical Devtool and EXO"
workflow = "test"
target = "chrootctl_root_module"

[wrapper.commands.module-package]
description = "module-package through canonical Devtool and EXO"
workflow = "package"
target = "chrootctl_root_module"

[wrapper.commands.module-validate]
description = "module-validate through canonical Devtool and EXO"
workflow = "validate"
target = "chrootctl_root_module"

[wrapper.commands.release-validate]
description = "release-validate through canonical Devtool and EXO"
workflow = "validate"
target = "chrootctl"

[wrapper.commands.ci-preflight]
description = "ci-preflight through canonical Devtool and EXO"
workflow = "ci-preflight"
target = "chrootctl_go"

[wrapper.commands.ci-local]
description = "ci-local through canonical Devtool and EXO"
workflow = "ci-local"
target = "chrootctl_go"

[wrapper.commands.ci-full]
description = "ci-full through canonical Devtool and EXO"
workflow = "ci-full"
target = "chrootctl_go"

# ---------------------------------------------------------------------------
# CC-05–CC-07: authoritative hosted GitHub Actions release, Linux x86_64.
# This never installs/changes an Android device or runs native-Termux jobs.
# ---------------------------------------------------------------------------
[targets.chrootctl_hosted_release]
runner = "command"
platform = "cli"
execution_environment = "host"
inputs = [".devtool.toml", "go.mod", "go.sum", "cmd/**", "internal/**", "scripts/**", "config/chrootctl/**", "docs/release/**"]
outputs = ["out/dual-release/**", "out/tmux/**", "out/rclone/**", "out/hosted-evidence/**"]

[targets.chrootctl_hosted_release.jobs.preflight]
runner = "command"
execution_environment = "host"
command = ["bash", "scripts/ci/hosted-release-stage.sh", "preflight"]

[targets.chrootctl_hosted_release.jobs.restore-go]
runner = "command"
execution_environment = "host"
command = ["bash", "scripts/ci/hosted-release-stage.sh", "restore-go"]

[targets.chrootctl_hosted_release.jobs.restore-tmux]
runner = "command"
execution_environment = "host"
command = ["bash", "scripts/ci/hosted-release-stage.sh", "restore-tmux"]

[targets.chrootctl_hosted_release.jobs.build-tmux]
runner = "command"
execution_environment = "host"
command = ["bash", "scripts/ci/hosted-release-stage.sh", "build-tmux"]
outputs = ["out/tmux/**"]

[targets.chrootctl_hosted_release.jobs.verify-tmux]
runner = "command"
execution_environment = "host"
command = ["bash", "scripts/ci/hosted-release-stage.sh", "verify-tmux"]
metadata = { read_only = true }

[targets.chrootctl_hosted_release.jobs.build-rclone]
runner = "command"
execution_environment = "host"
