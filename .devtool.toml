# chroot-ctl repository configuration for Devtool.
#
# Product boundaries are explicit: the normal Go CLI, the Android companion,
# and the repoctl release/module pipeline are independent Devtool targets.

[project]
runner = "go"
platform = "workspace"

[execution]
environment = "auto"
chroot_name = "androidos"

[toolchain]
manager = "none"

[build]
max_workers = 4

# ---------------------------------------------------------------------------
# Normal human-facing Go CLI/backend.  Intentionally omit root="." so MP07
# affected-target ownership is driven by the explicit inputs below instead of
# conservatively claiming Android-only changes.  The Go runner still resolves
# its project root to the repository root.
# ---------------------------------------------------------------------------

[targets.chrootctl_go]
runner = "go"
platform = "cli"
execution_environment = "auto"
inputs = [
  ".devtool.toml",
  "go.mod",
  "go.sum",
  "cmd/chrootctl/**",
  "cmd/sqlite-compat/**",
  "internal/**",
  "resources/**",
  "migration/**",
]
outputs = [
  ".devtool/build/go/**",
  ".devtool/package/go/**",
]

[targets.chrootctl_go.go]
vet = true
packages = ["./..."]
build_targets = ["./cmd/chrootctl"]
build_directory = ".devtool/build/go"
package_directory = ".devtool/package/go"
run_target = "./cmd/chrootctl"

[targets.chrootctl_go.go.outputs]
"./cmd/chrootctl" = "chrootctl"

# Android/ARM64 release runtime builds intentionally do not use a host-sensitive
# Go variant.  cmd/repoctl build-runtime is the sole release-authoritative path
# because it resolves the Termux/NDK compiler explicitly for CGO/SQLite.

# ---------------------------------------------------------------------------
# Android companion app
# ---------------------------------------------------------------------------

[targets.chrootctl_android]
runner = "android"
platform = "android"
root = "android"
execution_environment = "chroot"
chroot_name = "androidos"
# Inputs outside the Android root are explicit scheduler read scopes.  Android
# sources themselves are owned by root="android" for affected-target selection.
inputs = [
  ".",
  "../.devtool.toml",
  "../migration/contracts/v1/**",
  "../docs/release/**",
]
outputs = [
  ".gradle/**",
  ".kotlin/**",
  "build/**",
  "app/build/**",
]

[targets.chrootctl_android.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "never"
prefer_native_termux = false

[targets.chrootctl_android.gradle]
version = "9.7.1"
provider = "auto"
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
fail_fast = true
offline = false

[targets.chrootctl_android.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":chrootctlAndroidLintConfigurationSeal"]
clean = [":app:clean"]

[targets.chrootctl_android.artifacts]
required = true
external_verification = "auto"

# Resource policy lives in one place.  Command-line Devtool resource flags may
# override it without Gradle's JVM being artificially capped to two processors.
[targets.chrootctl_android.validation]
android_safe = false
split_gradle = false
max_workers = 4
cpu_limit = 4
parallel = true
no_daemon = false
stop_daemon_after_phase = false
low_priority = false
memory_guard_mb = 0
gradle_heap_mb = 2048
gradle_metaspace_mb = 768
affected_module_lint = false

# Compile/resources are transitively covered by test/package. The Android app
# seal aggregate is part of the gate so a chrootctl_android validation cannot
# accidentally report only Go/backend coverage.  The lint phase uses a deterministic
# configuration seal because native Termux may be unable to fetch the external
# androidLintTool classpath during artifact application; run :app:lintDebug after
# prewarming that dependency cache for full source lint.
[targets.chrootctl_android.validation.phases]
preflight = [":chrootctlAndroidAppSeal"]
dependencies = []
compile = []
resources = []
unit-test = [":app:testDebugUnitTest"]
package = [":app:assembleDebug"]
lint = [":chrootctlAndroidLintConfigurationSeal"]

# ---------------------------------------------------------------------------
# Root module product. This target owns the complete Magisk/KernelSU module
# surface: Go runtime/module integration, embedded WebUI, bridge contracts,
# module packaging/install structure, and module-focused release checks.
# Android remains a separate target while the companion app is being retired.
# ---------------------------------------------------------------------------

[targets.chrootctl_root_module]
runner = "command"
platform = "android"
execution_environment = "host"
inputs = [
  ".devtool.toml",
  "go.mod",
  "go.sum",
  "cmd/chrootctl/**",
  "cmd/repoctl/**",
  "internal/module/**",
  "internal/bridge/**",
  "internal/operations/**",
  "internal/users/**",
  "internal/services/**",
  "internal/rcloneops/**",
  "internal/catalog/**",
  "internal/repoctl/**",
  "internal/system/**",
  "internal/testseal/**",
  "migration/contracts/**",
  "docs/release/WEBUI_*.md",
]
outputs = [
  "out/module/**",
  "out/chrootctl-magisk.zip",
]
run_command = "go run ./cmd/repoctl host"
test_command = "node --check internal/module/webroot/chrootctl.js && node --check internal/module/webroot/index.js && go test ./internal/module ./internal/bridge ./internal/operations ./internal/users ./internal/services ./internal/rcloneops ./internal/catalog ./internal/repoctl && go run ./cmd/repoctl build-module --output-dir out/module --zip out/chrootctl-magisk.zip --jobs 2 --checksum"

[targets.chrootctl_root_module.workflows]
validate = ["runner:command#test"]

# ---------------------------------------------------------------------------
# repoctl release/module pipeline.  This target deliberately does not duplicate
# the normal CLI target.
# ---------------------------------------------------------------------------

[targets.chrootctl]
runner = "command"
platform = "release"
execution_environment = "host"
inputs = [
  ".devtool.toml",
  "go.mod",
  "go.sum",
  "cmd/repoctl/**",
  "internal/repoctl/**",
  "internal/contracts/**",
  "internal/module/**",
  "internal/testseal/**",
  "internal/system/**",
  "migration/contracts/**",
  "docs/release/**",
  "scripts/**",
  "build.sh",
]
outputs = [
  "out/**",
  "dist/**",
  "chrootctl-magisk.zip",
  "chrootctl-magisk.zip.sha256",
]
run_command = "go run ./cmd/repoctl host"
test_command = "go run ./cmd/repoctl validate"
build_command = "go run ./cmd/repoctl build-runtime"
package_command = "go run ./cmd/repoctl build-module"

[targets.chrootctl.workflows]
validate = ["runner:command#test"]
