# chroot-ctl repository configuration for Devtool.
#
# Primary project: Python chrootctl package.
# Package artifact: Magisk/KernelSU module produced by build.sh.
# Secondary target: Android companion app under ./android.

[project]
kind = "python"
python = "python3"
run_command = "chrootctl --help"
package_command = "bash build.sh"

[execution]
# Use native execution when available. Devtool may still be overridden with
# --chroot androidos when the host requires the Android build chroot.
environment = "auto"
chroot_name = "androidos"

[toolchain]
# Python/Android toolchains are managed by the repository and Devtool target
# settings rather than mise.
manager = "none"

[build]
# Conservative defaults for Termux/ARM64 hosts.
max_workers = 2

[python]
manager = "venv"
test_framework = "pytest"
extras = ["dev"]
locked = false
offline = false
install_project = true
lint = ["ruff", "mypy"]
validator_dependencies = ["build>=1.2"]
pre_commit = "auto"
source_import_isolation = false
cli_contract = false
isolation = true
disable_network = false
matrix = []
matrix_mode = "active"
fresh_dist = true
clean_categories = ["artifacts", "caches"]

[python.package]
verify_all_wheels = true
rebuild_sdist = true
import_smoke = true
verify_cli = true
install_dependencies = true
reproducible = false
import_modules = ["chrootctl"]
console_scripts = ["chrootctl", "chrootctl-app"]

# This repo is being validated for correctness/release behavior, not as a
# cybersecurity audit target.
[python.security]
enabled = false
tools = ["pip_audit", "bandit"]
sbom = false

[targets.chrootctl_android]
type = "android"
root = "android"
execution_environment = "chroot"
chroot_name = "androidos"

[targets.chrootctl_android.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "never"
prefer_native_termux = false

[targets.chrootctl_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 2
parallel = true
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
fail_fast = true
offline = false
args = [
  "--no-configuration-cache",
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.chrootctl_android.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = [":app:clean"]

[targets.chrootctl_android.artifacts]
required = true
external_verification = "auto"

# Keep Gradle memory bounded for Termux/ARM64 while leaving enough metaspace for
# AGP 9.3.1, Kotlin 2.4.10, KSP/Room, Compose, packaging, and lint.
[targets.chrootctl_android.validation]
android_safe = false
split_gradle = true
max_workers = 2
cpu_limit = 2
parallel = true
no_daemon = false
stop_daemon_after_phase = false
low_priority = false
memory_guard_mb = 512
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
gradle_packaging_metaspace_mb = 640
gradle_lint_metaspace_mb = 640
affected_module_lint = true

[targets.chrootctl_android.validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 768
gradle_metaspace_mb = 640
memory_guard_mb = 384
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.compile]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.resources]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.unit-test]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.package]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 640
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.lint]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 640
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.instrumentation]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1024
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phases]
preflight = [
  "help",
]
compile = [
  ":app:compileDebugSources",
]
resources = [
  ":app:processDebugResources",
]
unit-test = [
  ":app:testDebugUnitTest",
]
package = [
  ":app:assembleDebug",
]
lint = [
  ":app:lintDebug",
]

# ---------------------------------------------------------------------------
# Root Python / Magisk module target
# ---------------------------------------------------------------------------

[targets.chrootctl]
type = "python"
root = "."
execution_environment = "host"
chroot_name = "androidos"
run_command = "PYTHONPATH=src python3 -m chrootctl.cli --help"
test_command = "PYTHONPATH=src python3 -m pytest -q tests/test_native_runtime.py"
package_command = "bash build.sh"

[targets.chrootctl.python]
manager = "venv"
test_framework = "pytest"
extras = ["dev"]
locked = false
offline = false
install_project = false
lint = []
validator_dependencies = ["pytest", "rich>=13.7.0", "PyYAML>=6.0", "pydantic>=2.7.0", "pydantic-core>=2.0"]
pre_commit = "auto"
source_import_isolation = false
cli_contract = false
isolation = true
disable_network = false
matrix = []
matrix_mode = "active"
fresh_dist = false
clean_categories = ["artifacts", "caches"]

[targets.chrootctl.python.package]
verify_all_wheels = false
rebuild_sdist = false
import_smoke = false
verify_cli = false
install_dependencies = false
reproducible = false
import_modules = ["chrootctl"]
console_scripts = ["chrootctl", "chrootctl-app"]

[targets.chrootctl.python.security]
enabled = false
tools = []
sbom = false
