  { id = "runtime", ref = "job:chrootctl-root-build-runtime", depends_on = ["tmux-verify", "repoctl"] },
  { id = "module", ref = "job:chrootctl-root-build-module", depends_on = ["runtime"] },
  { id = "build-seal", ref = "job:chrootctl-root-build-seal", depends_on = ["module"] },
  { id = "webui-test", ref = "job:chrootctl-root-test-webui", depends_on = ["build-seal"] },
