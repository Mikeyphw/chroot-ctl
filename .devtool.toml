# chroot-ctl repository configuration for Devtool.
#
# Production backend: Go chrootctl rooted at ./cmd/chrootctl.
# Module packaging/release: cmd/repoctl.
# Android companion target: ./android.

[project]
kind = "go"

[execution]
environment = "auto"
chroot_name = "androidos"

[toolchain]
manager = "none"

[build]
max_workers = 2

# ---------------------------------------------------------------------------
# Go production backend target
# ---------------------------------------------------------------------------

[targets.chrootctl_go]
type = "go"
root = "."
execution_environment = "auto"

[targets.chrootctl_go.go]
coalesce_validation = true
vet = true
packages = ["./..."]
build_targets = ["./cmd/chrootctl"]
build_directory = ".devtool/build/go"
package_directory = ".devtool/package/go"
run_target = "./cmd/chrootctl"

[targets.chrootctl_go.go.outputs]
"./cmd/chrootctl" = "chrootctl"

# Shipping Android/module backend profile. SQLite requires CGO; native Termux clang or an Android NDK compiler must be available.
# Keep normal validation native to the current host so Go tests can execute.
[targets.chrootctl_go.variants.android-arm64.env]
GOOS = "android"
GOARCH = "arm64"
CGO_ENABLED = "1"

[targets.chrootctl_go.variants.android-arm64.go]
build_directory = ".devtool/build/go/android-arm64"
package_directory = ".devtool/package/go/android-arm64"

[targets.chrootctl_android]
type = "android"
root = "android"
execution_environment = "chroot"
chroot_name = "androidos"

[targets.chrootctl_android.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "never"
prefer_native_termux = false

[targets.chrootctl_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 2
parallel = true
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
fail_fast = true
offline = false
args = [
  "--no-configuration-cache",
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.chrootctl_android.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = [":app:clean"]

[targets.chrootctl_android.artifacts]
required = true
external_verification = "auto"

# Keep Gradle memory bounded for Termux/ARM64 while leaving enough metaspace for
# AGP 9.3.1, Kotlin 2.4.10, KSP/Room, Compose, packaging, and lint.
[targets.chrootctl_android.validation]
android_safe = false
split_gradle = true
max_workers = 2
cpu_limit = 2
parallel = true
no_daemon = false
stop_daemon_after_phase = false
low_priority = false
memory_guard_mb = 512
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
gradle_packaging_metaspace_mb = 640
gradle_lint_metaspace_mb = 640
affected_module_lint = true

[targets.chrootctl_android.validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 768
gradle_metaspace_mb = 640
memory_guard_mb = 384
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.compile]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.resources]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.unit-test]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.package]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 640
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.lint]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 640
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phase_profiles.instrumentation]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1024
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false

[targets.chrootctl_android.validation.phases]
preflight = [
  "help",
]
compile = [
  ":app:compileDebugSources",
]
resources = [
  ":app:processDebugResources",
]
unit-test = [
  ":app:testDebugUnitTest",
]
package = [
  ":app:assembleDebug",
]
lint = [
  ":app:lintDebug",
]

# ---------------------------------------------------------------------------
# Go-native module/release command target
# ---------------------------------------------------------------------------

[targets.chrootctl]
type = "command"
root = "."
execution_environment = "host"
run_command = "go run ./cmd/chrootctl --help"
test_command = "go test -p 2 ./..."
build_command = "go run ./cmd/repoctl build-runtime"
package_command = "go run ./cmd/repoctl build-module"
