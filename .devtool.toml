# ---------------------------------------------------------------------------
# Repository source/release validation. repoctl exposes the current source gates
# individually so Devtool can represent them as sibling EXO nodes rather than a
# single opaque `repoctl validate` process.
# ---------------------------------------------------------------------------

[jobs.chrootctl-validate-test-seal]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "test-seal"]
inputs = ["migration/**", "internal/**", "docs/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-repository-purity]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "repository-purity"]
inputs = ["."]
metadata = { read_only = true }

[jobs.chrootctl-validate-audit-coverage]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "audit-coverage"]
inputs = ["docs/audit/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-root-retirement]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "root-module-retirement"]
inputs = [".devtool.toml", ".github/workflows/**", "android/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-contract-generation]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "contract-generation"]
inputs = ["migration/contracts/**", "internal/contracts/**", "internal/contractgen/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-cli-contract]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "cli-contract"]
inputs = ["cmd/chrootctl/**", "internal/cli/**", "migration/contracts/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-mutation-engine]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "mutation-engine"]
inputs = ["internal/**", "migration/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-crud-atomicity]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "crud-atomicity"]
inputs = ["internal/**", "migration/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-clipboard]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "clipboard-integration"]
inputs = ["internal/clipboard/**", "internal/services/**", "internal/cli/**", "migration/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-contracts]
runner = "go"
execution_environment = "native-termux"
command = ["out/repoctl-devtool", "validate-step", "frozen-live-contracts"]
inputs = ["migration/contracts/**", "internal/contracts/**", "internal/bridge/**", "internal/cli/**"]
metadata = { read_only = true }

[jobs.chrootctl-validate-go-test]
runner = "go"
execution_environment = "native-termux"
command = ["go", "test", "-p", "2", "./..."]
inputs = ["go.mod", "go.sum", "cmd/**", "internal/**", "migration/**", "scripts/**", ".devtool.toml"]
metadata = { read_only = true }

[jobs.chrootctl-validate-go-vet]
runner = "go"
execution_environment = "native-termux"
command = ["go", "vet", "./..."]
inputs = ["go.mod", "go.sum", "cmd/**", "internal/**"]
metadata = { read_only = true }

[targets.chrootctl]
runner = "command"
platform = "release"
execution_environment = "native-termux"
inputs = [
  ".devtool.toml",
  "go.mod",
  "go.sum",
  "cmd/chrootctl/**",
  "cmd/repoctl/**",
  "internal/**",
  "migration/contracts/**",
  "docs/release/**",
  "scripts/**",
  "build.sh",
]
outputs = ["out/**", "dist/**", "chrootctl.zip", "chrootctl.zip.sha256"]
run_command = "go run ./cmd/repoctl host"
build_command = "go run ./cmd/repoctl build-runtime"
package_command = "go run ./cmd/repoctl build-module"

[targets.chrootctl.workflows]
validate = [
  { id = "repoctl", ref = "job:chrootctl-build-repoctl-devtool", depends_on = [] },
  { id = "test-seal", ref = "job:chrootctl-validate-test-seal", depends_on = ["repoctl"] },
  { id = "purity", ref = "job:chrootctl-validate-repository-purity", depends_on = ["repoctl"] },
  { id = "audit", ref = "job:chrootctl-validate-audit-coverage", depends_on = ["repoctl"] },
  { id = "retirement", ref = "job:chrootctl-validate-root-retirement", depends_on = ["repoctl"] },
  { id = "contract-gen", ref = "job:chrootctl-validate-contract-generation", depends_on = ["repoctl"] },
  { id = "cli", ref = "job:chrootctl-validate-cli-contract", depends_on = ["repoctl"] },
  { id = "mutation", ref = "job:chrootctl-validate-mutation-engine", depends_on = ["repoctl"] },
  { id = "crud", ref = "job:chrootctl-validate-crud-atomicity", depends_on = ["repoctl"] },
  { id = "clipboard", ref = "job:chrootctl-validate-clipboard", depends_on = ["repoctl"] },
  { id = "contracts", ref = "job:chrootctl-validate-contracts", depends_on = ["repoctl"] },
  { id = "go-test", ref = "job:chrootctl-validate-go-test", depends_on = ["repoctl"] },
  { id = "go-vet", ref = "job:chrootctl-validate-go-vet", depends_on = ["repoctl"] },
]

[workspace]
default_target = "chrootctl"

[workspace.groups]
go = ["chrootctl_go"]
module = ["chrootctl_root_module"]
release = ["chrootctl"]
all = ["@go", "@module", "@release"]

[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1
max_dotnet_nodes = 1

[targets.chrootctl_go.jobs.ci-actions-contract]
runner = "command"
command = ["go", "run", "./cmd/devtoolgates", "actions"]
inputs = [".devtool.toml", ".github/workflows/*.yml", "cmd/devtoolgates/**"]
metadata = { read_only = true }

[targets.chrootctl_go.jobs.r1-source-contract]
runner = "command"
command = ["go", "run", "./cmd/devtoolgates", "r1"]
inputs = ["cmd/devtoolgates/**", "cmd/chrootctl/main.go", "internal/skybindr1/**"]
metadata = { read_only = true }

[targets.chrootctl_go.jobs.api03-skybind-feature]
runner = "command"
command = ["bash", "scripts/api03-source-check.sh"]
inputs = ["cmd/chrootctl/main.go", "internal/skybindfeature/**", "scripts/api03-source-check.sh"]
metadata = { read_only = true }

[targets.chrootctl_go.workflows]
ci-preflight = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "r1-source", ref = "job:r1-source-contract", depends_on = [] },
  { id = "api03", ref = "job:api03-skybind-feature", depends_on = [] },
]
