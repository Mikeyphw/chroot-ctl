# chroot-ctl repository configuration for Devtool.
#
# Product boundaries are explicit: the normal Go CLI, the Android companion,
# and the repoctl release/module pipeline are independent Devtool targets.

[project]
runner = "go"
platform = "workspace"

[execution]
environment = "auto"
chroot_name = "androidos"

[toolchain]
manager = "none"

[build]
max_workers = 4

# ---------------------------------------------------------------------------
# Normal human-facing Go CLI/backend.  Intentionally omit root="." so MP07
# affected-target ownership is driven by the explicit inputs below instead of
# conservatively claiming Android-only changes.  The Go runner still resolves
# its project root to the repository root.
# ---------------------------------------------------------------------------

[targets.chrootctl_go]
runner = "go"
platform = "cli"
execution_environment = "auto"
inputs = [
  ".devtool.toml",
  "go.mod",
  "go.sum",
  "cmd/chrootctl/**",
  "cmd/sqlite-compat/**",
  "internal/**",
  "resources/**",
  "migration/**",
]
outputs = [
  ".devtool/build/go/**",
  ".devtool/package/go/**",
]

[targets.chrootctl_go.go]
vet = true
packages = ["./..."]
build_targets = ["./cmd/chrootctl"]
build_directory = ".devtool/build/go"
package_directory = ".devtool/package/go"
run_target = "./cmd/chrootctl"

[targets.chrootctl_go.go.outputs]
"./cmd/chrootctl" = "chrootctl"

# Android/ARM64 release runtime builds intentionally do not use a host-sensitive
# Go variant.  cmd/repoctl build-runtime is the sole release-authoritative path
# because it resolves the Termux/NDK compiler explicitly for CGO/SQLite.

# ---------------------------------------------------------------------------
# Android companion app
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Root module product. This is the supported Android delivery surface:
# Magisk/KernelSU module + embedded WebUI + Go runtime/bridge.
# The standalone Android companion app was retired by WR12.
# ---------------------------------------------------------------------------

[targets.chrootctl_root_module]
runner = "command"
platform = "android"
execution_environment = "native-termux"
inputs = [
  ".devtool.toml",
  "go.mod",
  "go.sum",
  "cmd/chrootctl/**",
  "cmd/repoctl/**",
  "internal/module/**",
  "internal/bridge/**",
  "internal/**",
  "migration/contracts/**",
  "docs/release/WEBUI_*.md",
  "docs/release/ROOT_MODULE_*.md",
  "docs/release/compatibility-manifest.json",
  "docs/release/VALIDATION_EVIDENCE.md",
  "scripts/devtool/root-module-*.sh",
  "scripts/tmux/**",
  "docs/runtime/TMUX_STATIC_RUNTIME.md",
]
outputs = [
  "out/native-runtime/**",
  "out/tmux/**",
  "out/module/**",
  "out/chrootctl.zip",
  "out/chrootctl.zip.sha256",
  "out/devtool-evidence/**",
]
restore_command = "scripts/devtool/root-module-restore.sh"
build_command = "scripts/devtool/root-module-build.sh"
test_command = "scripts/devtool/root-module-test.sh"
package_command = "scripts/devtool/root-module-package.sh"
run_command = "scripts/devtool/root-module-install.sh"

# ---------------------------------------------------------------------------
# EXO-visible root-module lifecycle jobs.
# Each job is one independently meaningful operation. Read-only gates declare
# read_only=true; producers declare their exact repository output scopes.
# ---------------------------------------------------------------------------

[targets.chrootctl_root_module.artifacts]
required = false
verify = false
paths = [
    "out/chrootctl.zip",
    "out/chrootctl.zip.sha256",
    "out/module/config/chrootctl/validation-results.json",
]
directories = [
    "out/devtool-evidence",
]
recursive = true
[jobs.chrootctl-root-evidence-reset]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "restore-reset"]
inputs = ["scripts/devtool/root-module-evidence.sh"]
outputs = ["out/devtool-evidence/**"]

[jobs.chrootctl-root-restore-go]
runner = "go"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "restore-go"]
inputs = ["go.mod", "go.sum"]
metadata = { read_only = true }

[jobs.chrootctl-root-restore-tmux]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "restore-tmux"]
inputs = ["scripts/tmux/**"]
outputs = [".devtool/cache/tmux-sources/**"]

[jobs.chrootctl-root-restore-seal]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "restore-seal"]
inputs = ["out/devtool-evidence/**", "internal/module/webroot/**"]
outputs = ["out/devtool-evidence/root_restore.ok"]

[jobs.chrootctl-root-build-tmux]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "build-tmux"]
inputs = ["scripts/tmux/**", ".devtool/cache/tmux-sources/**"]
outputs = ["out/tmux/**", "out/tmux-build/**"]

[jobs.chrootctl-root-verify-tmux]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "build-tmux-verify"]
inputs = ["out/tmux/**", "scripts/tmux/verify-static-android-arm64.sh"]
metadata = { read_only = true }

[jobs.chrootctl-build-repoctl-devtool]
runner = "go"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "build-repoctl"]
inputs = ["go.mod", "go.sum", "cmd/repoctl/**", "internal/**"]
outputs = ["out/repoctl-devtool"]

[jobs.chrootctl-root-build-runtime]
runner = "go"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "build-runtime"]
inputs = ["out/repoctl-devtool", "out/tmux/**", "cmd/chrootctl/**", "internal/**"]
outputs = ["out/native-runtime/**"]

[jobs.chrootctl-root-build-module]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "build-module"]
inputs = ["out/repoctl-devtool", "out/native-runtime/**", "internal/module/**", "docs/release/compatibility-manifest.json"]
outputs = ["out/module/**", "out/chrootctl.zip", "out/chrootctl.zip.sha256"]

[jobs.chrootctl-root-build-seal]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "build-seal"]
inputs = ["out/module/**", "out/chrootctl.zip", "out/chrootctl.zip.sha256"]
outputs = ["out/devtool-evidence/root_build.ok"]

[jobs.chrootctl-root-test-webui]
runner = "node"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "test-webui"]
inputs = ["internal/module/webroot/**", "internal/module/*.mjs"]
metadata = { read_only = true }

[jobs.chrootctl-root-test-go]
runner = "go"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "test-go"]
inputs = ["go.mod", "go.sum", "cmd/**", "internal/**", "migration/**", ".devtool.toml"]
metadata = { read_only = true }

[jobs.chrootctl-root-test-tmux]
runner = "go"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "test-tmux"]
inputs = ["go.mod", "go.sum", "internal/repoctl/**", "scripts/tmux/**"]
metadata = { read_only = true }

[jobs.chrootctl-root-test-seal]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "test-seal"]
inputs = ["scripts/devtool/root-module-evidence.sh"]
outputs = ["out/devtool-evidence/root_test.ok"]

[jobs.chrootctl-root-lint-go]
runner = "go"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "lint-go"]
inputs = ["go.mod", "go.sum", "cmd/**", "internal/**"]
metadata = { read_only = true }

[jobs.chrootctl-root-lint-native]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "lint-native"]
inputs = ["scripts/devtool/**", "scripts/tmux/**"]
metadata = { read_only = true }

[jobs.chrootctl-root-lint-seal]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "lint-seal"]
inputs = ["scripts/devtool/root-module-evidence.sh"]
outputs = ["out/devtool-evidence/root_lint.ok"]

[jobs.chrootctl-root-package-preflight]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "package-preflight"]
inputs = [".devtool.toml", "out/module/**", "out/chrootctl.zip", "out/chrootctl.zip.sha256"]
metadata = { read_only = true }

[jobs.chrootctl-root-package-runtime]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "package-runtime"]
inputs = ["out/module/**", "out/chrootctl.zip", "scripts/tmux/verify-static-android-arm64.sh"]
metadata = { read_only = true }

[jobs.chrootctl-root-package-webui]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "package-webui"]
inputs = ["cmd/chrootctl/main.go", "internal/module/module.go", "internal/standalonewebui/**"]
metadata = { read_only = true }

[jobs.chrootctl-root-package-evidence]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-stage.sh", "package-evidence"]
inputs = ["out/devtool-evidence/**", "out/repoctl-devtool", "out/module/**", "out/chrootctl.zip", "out/chrootctl.zip.sha256"]
outputs = ["out/module/config/chrootctl/validation-results.json", "out/chrootctl.zip", "out/chrootctl.zip.sha256"]

[jobs.chrootctl-root-module-install]
runner = "command"
execution_environment = "native-termux"
command = ["scripts/devtool/root-module-install.sh"]
inputs = ["out/chrootctl.zip", "scripts/devtool/root-module-install.sh"]
metadata = { read_only = true }

[targets.chrootctl_root_module.workflows]
restore = [
  { id = "reset", ref = "job:chrootctl-root-evidence-reset", depends_on = [] },
  { id = "go", ref = "job:chrootctl-root-restore-go", depends_on = ["reset"] },
  { id = "tmux-source", ref = "job:chrootctl-root-restore-tmux", depends_on = ["reset"] },
